name: Yayın

# Sürüm etiketi push edildiğinde npm'e yayımlar. Yayın öncesi tam doğrulama
# zinciri koşar; kırmızıysa yayın yapılmaz.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Doğrulama zinciri libxml2 ve OpenSSL ile karşılaştırma yapıyor;
      # ikisi de kurulu olmadan yayın öncesi denetim eksik koşar.
      - name: Referans araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --version
          openssl version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Kilit dosyası npm 11 ile üretiliyor; Node 20 ve 22 npm 10 ile gelir
      # ve isteğe bağlı platform paketlerini (@esbuild/*) çözemeyip `npm ci`yi
      # EUSAGE ile reddeder.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:publish
      - run: npm run check:types

      - name: Etiket ile package.json sürümü aynı mı
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "etiket=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ] || { echo "HATA: sürümler uyuşmuyor"; exit 1; }

      # Kimlik açıkça proje `.npmrc`sine yazılır. `setup-node`un yazdığı
      # kullanıcı yapılandırmasına güvenmek kırılgan: npm sürümü yükseltilince
      # (aşağıdaki `npm i -g npm@11`) belirteç okunamayıp ENEEDAUTH veriyor.
      # Proje `.npmrc`si dosya öncelik sırasında en üsttedir ve npm onu
      # yayınlanan pakete hiçbir zaman koymaz.
      - name: npm kimliğini yapılandır
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '\n//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> .npmrc

      - run: npm publish --provenance --access public

      - name: GitHub sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
