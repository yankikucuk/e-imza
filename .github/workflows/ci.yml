name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      # Testler üç bağımsız referans uygulamayla karşılaştırma yapıyor ve
      # üçü de gerçekten kurulu olmalı: kanonikleştirme libxml2 (xmllint),
      # ASN.1 ve CMS OpenSSL, PDF imzası poppler (pdfsig) ile doğrulanıyor.
      # Araç yoksa o testler atlanır — ama atlanmaları sessiz kalmasın diye
      # her birinin varlığı ayrıca iddia ediliyor.
      - name: Referans araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils poppler-utils
          xmllint --version
          openssl version
          pdfsig -v

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Kilit dosyası npm 11 ile üretiliyor; Node 20 ve 22 npm 10 ile gelir
      # ve isteğe bağlı platform paketlerini (@esbuild/*) çözemeyip `npm ci`yi
      # EUSAGE ile reddeder. Matristeki tüm sürümler aynı npm ile çalışsın.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:publish
      - run: npm run check:types
