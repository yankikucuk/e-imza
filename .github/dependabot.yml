# Dependabot yapılandırması.
#
# Gruplama ŞART: vitest ve @vitest/coverage-v8 birbirine KATI bir peer
# bağımlılıkla bağlı (coverage paketi tam sürüm eşleşmesi istiyor). Ayrı
# ayrı yükseltildiklerinde `npm ci` çözümleme hatasıyla düşer ve CI kırmızı
# olur.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # TypeScript major'ları YUKARI AKIŞ TARAFINDAN engelli: typescript-eslint
      # peer aralığı `typescript >=4.8.4 <6.1.0` istiyor ve TS 7'yi destekleyen
      # bir sürümü henüz yok. Bu kural olmadan Dependabot her hafta `npm ci`
      # çözümleme hatasıyla düşen bir PR açıyor. typescript-eslint TS 7
      # desteğini yayınladığında KALDIRILMALI.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Sürümleri birlikte hareket etmek ZORUNDA olan paketler.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # Birlikte çalışabilirlik referansları AYRI grupta.
      #
      # `xadesjs` bu depoda bir bağımlılık değil, bir ÖLÇÜM ARACI: testler
      # onun belirli bir sürümünün belirli bir davranışını sabitliyor
      # (bkz. tests/xadesjs-interop.test.ts — xadesjs#73). Sürüm yükselince
      # o testin kırmızıya dönmesi bir arıza değil, beklenen sinyaldir:
      # ya hatayı düzeltmişlerdir ve bulgumuzu güncellememiz gerekir, ya da
      # davranış başka yönde değişmiştir. Ayrı grup, bu PR'ın diğer araç
      # yükseltmelerinin arasında kaybolmasını engelliyor.
      interop-oracles:
        patterns:
          - xadesjs
          - '@xmldom/xmldom'

      # Kalan geliştirme araçları tek PR'da toplansın; bu depoda çalışma
      # zamanı bağımlılığı yok, dolayısıyla üretim grubuna gerek de yok.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - vitest
          - '@vitest/*'
          - xadesjs
          - '@xmldom/xmldom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
