# Depo issue/PR etiketlerinin tek kaynağı.
# .github/workflows/labels-sync.yml tarafından haftalık senkronize edilir;
# buradan silinen etiket depodan da silinir.

# ── Tür ───────────────────────────────────────────────────────────────
- name: 'tür: hata'
  color: 'd73a4a'
  description: 'Beklenmeyen davranış veya çalışmayan bir şey'
- name: 'tür: özellik'
  color: '0e8a16'
  description: 'Yeni yetenek veya mevcut bir yeteneğin genişletilmesi'
- name: 'tür: dokümantasyon'
  color: '0075ca'
  description: 'README, JSDoc, örnekler veya spec'
- name: 'tür: test'
  color: '1d76db'
  description: 'Test ekleme, güçlendirme veya düzeltme'
- name: 'tür: bakım'
  color: 'fef2c0'
  description: 'Bağımlılık, araç zinciri, CI ve yeniden düzenleme'
- name: 'tür: soru'
  color: 'd876e3'
  description: 'Kullanım sorusu veya açıklama talebi'

# ── Alan (katman) ─────────────────────────────────────────────────────
- name: 'alan: çekirdek'
  color: 'c5def5'
  description: 'Hata sınıfları ve bayt yardımcıları'
- name: 'alan: xml'
  color: 'c5def5'
